# SonarQube analysis of the Go CLI. The scanner reads this file from its working
# directory, so it must be run from go/ — `make sonarqube-analyze-go` at the
# repository root does that for you (and builds the coverage report first).
#
# The server URL and the analysis token are NOT here: they are
# environment-specific and the token is a secret. Export SONAR_HOST_URL and
# SONAR_TOKEN instead.
sonar.projectKey=azure-rd-go
sonar.projectName=azure-rd CLI
sonar.sourceEncoding=UTF-8

# Every path below is relative to this folder, which is the analysis root.
sonar.sources=.
sonar.tests=.

# Sources and tests are the same tree, so the split has to be declared from
# both sides: *_test.go files form the test set and are excluded from the
# source set. Dropping the exclusion makes the scanner index them twice.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,output/**,azure-rd,coverage.html

# `output/` above is not housekeeping: a tenant export is customer
# configuration (Intune/Entra policies, group memberships) and must never be
# uploaded to a code-quality server. Keep it excluded.

# Written by `make test-coverage` in this folder.
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=**/*_test.go

# Suppressed rules. Each entry here has a counterpart in .golangci.yml, which is
# the file that explains WHY — this project's rule is that a finding is either
# reported by both tools or by neither, so a suppression added on one side alone
# does not reduce noise, it just makes the two disagree.
#
#   e1  go:S3776 on *_test.go — table-driven tests score high for reasons that
#       are not maintainability risk. Note that `sonar.exclusions` above does
#       NOT cover this: it removes test files from the SOURCE set, but they are
#       still indexed as tests via sonar.tests + sonar.test.inclusions, and the
#       Go analyzer reports S3776 on them (13 findings before this entry).
#   e2  go:S3776 on the Graph handlers — the score measures the shared
#       closure-in-constructor pattern rather than the individual file; all 45
#       land in a 27–34 band. Scoped to graph/ only, so internal/handlers/arm/
#       and internal/handlers/requests.go stay reported.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/handlers/graph/*.go

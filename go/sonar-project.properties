# SonarQube analysis of the Go CLI. The scanner reads this file from its working
# directory, so it must be run from go/ — `make sonarqube-analyze-go` at the
# repository root does that for you (and builds the coverage report first).
#
# The server URL and the analysis token are NOT here: they are
# environment-specific and the token is a secret. Export SONAR_HOST_URL and
# SONAR_TOKEN instead.
sonar.projectKey=azure-rd-go
sonar.projectName=azure-rd CLI
sonar.sourceEncoding=UTF-8

# Every path below is relative to this folder, which is the analysis root.
sonar.sources=.
sonar.tests=.

# Sources and tests are the same tree, so the split has to be declared from
# both sides: *_test.go files form the test set and are excluded from the
# source set. Dropping the exclusion makes the scanner index them twice.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,output/**,azure-rd,coverage.html

# `output/` above is not housekeeping: a tenant export is customer
# configuration (Intune/Entra policies, group memberships) and must never be
# uploaded to a code-quality server. Keep it excluded.

# Written by `make test-coverage` in this folder.
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=**/*_test.go

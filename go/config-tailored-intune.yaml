# A worked, opinionated BASE configuration for an Intune-centred tenant.
#
# Load it with --config, or copy it to <config-dir>/base.yaml. It holds general
# settings only: the tenant's own identity (subscription, client-id, tenant-id)
# and its filters belong in <config-dir>/<domain>.yaml — see
# config.example.domain.yaml.
#
# Unlike config.example.yaml this is NOT a no-op: it resolves secrets, drops two
# transformers, defines a taxonomy and a consistency catalog, so it changes the
# exported bytes, the recorded hashes and the consistency analysis. Use it as a
# starting point, not as a default.
#
# --dry-run and --log-level are command-line switches and deliberately have no
# key here: they belong to one invocation, not to a configuration.

# WARNING: writes decrypted Intune OMA-URI secrets to disk in plaintext.
resolve-secrets: true

prune: false

transformers:
  - name: name-sanitization
  - name: base64-decode

# Per-resource-type filters are TENANT-SCOPED and belong in the tenant's profile
# (<config-dir>/<domain>.yaml), not here: the patterns encode one tenant's naming
# convention, and the filter configuration is hashed into the export metadata
# where it gates drift comparability. See config.example.domain.yaml.

taxonomy:
  version: 1
  # 'programmes:' is the 'programme' axis (which initiative a resource serves).
  # 'axes:' below adds independent facets (platform, scope) resolved from the
  # same exported facts, so the index can be sliced on several dimensions at once.
  programmes:
    # CIS hardening baselines — names carry a _CIS_ token (and usually an _L1 / -L1 level).
    - id: cis-hardening
      label: CIS hardening
      match:
        - name: '_cis_'
        - name: '[_-]l1$'

    # Compliance validation policies and their noncompliance notifications.
    - id: compliance
      label: Compliance
      match:
        - name: 'validation'
        - type: Microsoft.Graph/deviceCompliancePolicies
        - type: Microsoft.Graph/compliancePolicies

    # Microsoft Defender for Endpoint / next-gen protection / ASR.
    - id: defender
      label: Defender / MDE
      match:
        - name: '(?:mde|defender|\bngp\b|\basr\b)'
        - type: Microsoft.Graph/mobileThreatDefenseConnectors

    # VPN configuration and clean-up.
    - id: vpn
      label: VPN
      match:
        - name: 'vpn'

    # Windows Update: rings, feature and driver update profiles.
    - id: windows-update
      label: Windows Update
      match:
        - name: '(?:updatering|windows-update)'
        - type: Microsoft.Graph/windowsFeatureUpdateProfiles
        - type: Microsoft.Graph/windowsDriverUpdateProfiles

    # Enrollment & Autopilot provisioning (device identities are bulk-excluded).
    - id: enrollment
      label: Enrollment & Autopilot
      match:
        - name: '(?:autopilot|_ade\b|enrollment)'
        - type: Microsoft.Graph/windowsAutopilotDeploymentProfiles
        - type: Microsoft.Graph/deviceEnrollmentConfigurations
        - type: Microsoft.Graph/depOnboardingSettings
        - type: Microsoft.Graph/applePushNotificationCertificate
        - type: Microsoft.Graph/intuneBrandingProfiles

    # Identity & conditional access.
    - id: identity-access
      label: Identity & conditional access
      match:
        - name: '(?:\bca\d{2}|\bmfa\b|2fa|passwordless|phishing|whfb|sso|cloudtrust)'
        - type: Microsoft.Graph/conditionalAccessPolicies
        - type: Microsoft.Graph/authenticationStrengthPolicies
        - type: Microsoft.Graph/authenticationMethodsPolicy
        - type: Microsoft.Graph/authorizationPolicy

    # Disk / device encryption.
    - id: encryption
      label: Encryption
      match:
        - name: '(?:bitlocker|filevault|encryption)'

    # Hybrid Entra domain join provisioning and its target groups.
    - id: hybrid-join
      label: Hybrid domain join
      match:
        - name: '(?:hybridjoin|domjoin)'
        - type: Microsoft.Graph/onPremisesSynchronization

    # Local Administrator Password Solution. Bare 'laps' (not \blaps\b): an
    # underscore is a word char, so \b never fires in Account_LAPS-*.
    - id: laps
      label: LAPS
      match:
        - name: 'laps'

    # Host firewall configuration.
    - id: firewall
      label: Firewall
      match:
        - name: 'firewall'

    # Application delivery and app configuration.
    - id: app-delivery
      label: App delivery
      match:
        - type: Microsoft.Graph/mobileApps
        - name: '_app_'
        - name: '(?:auto[ _-]?update|onedrive|teamviewer)'

    # Proactive remediations and platform scripts (Windows/macOS).
    - id: scripts
      label: Scripts & remediations
      match:
        - type: Microsoft.Graph/deviceHealthScripts
        - type: Microsoft.Graph/deviceManagementScripts
        - type: Microsoft.Graph/deviceShellScripts
        - type: Microsoft.Graph/deviceCustomAttributeShellScripts

    # Assignment targeting: security/dynamic groups and assignment filters.
    - id: targeting
      label: Targeting (groups & filters)
      match:
        - type: Microsoft.Graph/groups
        - type: Microsoft.Graph/assignmentFilters

    # Endpoint OS hardening that does not carry a _CIS_ token.
    - id: security-hardening
      label: Security hardening
      match:
        - name: '(?:applocker|secure ?boot|\bsmb\b|llmnr|mdns|ipv6|windows-components)'

    # Network & connectivity (Wi-Fi, wired, proxy). VPN stays its own programme.
    - id: network
      label: Network & connectivity
      match:
        - name: '(?:wifi|wi-fi|wlan|ethernet|proxy)'

    # RBAC and delegated administration.
    - id: governance
      label: Governance & RBAC
      match:
        - type: Microsoft.Graph/roleScopeTags
        - type: Microsoft.Graph/roleDefinitions

    # Tenant-wide / org singletons.
    - id: tenant-config
      label: Tenant configuration
      match:
        - type: Microsoft.Graph/deviceManagement
        - type: Microsoft.Graph/organization

    # General endpoint baseline tweaks (logging, telemetry, UX, power, conflicts).
    - id: endpoint-baseline
      label: Endpoint baseline config
      match:
        - name: '(?:logging|health ?monitoring|datensammlung|telemetr|diagnostic|taskbar|widget|location ?service|energie|mdm wins)'

  axes:
    # Target platform, from the exported 'platforms' fact, the WIN/MAC/... naming
    # tokens this tenant uses, and platform-specific resource types (e.g. shell
    # scripts are macOS, PowerShell/health scripts are Windows). Resources with
    # no platform (groups, conditional access, tenant config) stay uncategorised
    # here — that is expected, not a gap.
    - id: platform
      label: Platform
      values:
        - id: windows
          label: Windows
          match:
            - platforms: 'windows'
            - name: '_win_'
            # @odata.type carries the platform for configs & apps that lack a
            # platforms fact: win32LobApp, winGetApp, windows*Configuration,
            # officeSuiteApp (M365 Apps for Windows).
            - odataType: 'graph\.(?:win|officesuiteapp)'
            - type: Microsoft.Graph/windowsFeatureUpdateProfiles
            - type: Microsoft.Graph/windowsDriverUpdateProfiles
            - type: Microsoft.Graph/windowsAutopilotDeploymentProfiles
            - type: Microsoft.Graph/deviceManagementScripts
            - type: Microsoft.Graph/deviceHealthScripts
            - type: Microsoft.Graph/groupPolicyConfigurations   # ADMX / administrative templates (Windows)
        - id: macos
          label: macOS
          match:
            - platforms: 'macos'
            - name: '(?:_mac_|_osx_)'
            # macOS* device configs and apps (macOSCustomConfiguration,
            # macOSExtensionsConfiguration, macOSLobApp, macOSOfficeSuiteApp, ...).
            - odataType: 'graph\.macos'
            - type: Microsoft.Graph/deviceShellScripts
            - type: Microsoft.Graph/deviceCustomAttributeShellScripts
        - id: ios
          label: iOS/iPadOS
          match:
            - platforms: '(?:ios|ipados)'
            - name: '(?:_ios_|_ipad)'
            - odataType: 'graph\.ios'
        - id: android
          label: Android
          match:
            - platforms: 'android'
            - name: '_android_'
            - odataType: 'graph\.android'
        - id: linux
          label: Linux
          match:
            - platforms: 'linux'
            - name: '_linux_'

    # Assignment scope, from the device/user fact (derived from the _D_ / _U_
    # naming token). Resources with no scope (groups, filters, singletons) stay
    # uncategorised here.
    - id: scope
      label: Assignment scope
      values:
        - id: device
          label: Device
          match:
            - scope: device
        - id: user
          label: User
          match:
            - scope: user

# The consistency catalog read by 'docs analyze-consistency': which settings
# describe the same control across policy types (compliance included), how
# resources group into topics, and which cross-type relations to check. Copy
# this section into your base file to opt in; without it the analysis joins
# exact keys only. Member and selector keys are canonical index keys (see
# config.example.yaml for the forms and the closed vocabularies).
#
# The catalog was reviewed against Microsoft Learn on 2026-10-03 and the entries
# were checked against two real tenant exports. 2 equivalences and 7 rules are
# 'status: verified' (each with a cited Learn source); the rest stay 'verify',
# because the Apple key mappings rest on Apple's payload documentation rather than
# Learn, and a finding resting on a 'verify' entry is never firm. Promote an entry
# only with a cited source. 'enforced' is set only on the password equivalences,
# which Learn documents as remediated on Windows, macOS and iOS; everywhere else
# it is left out (= evaluated only). Assignment-filter and include/exclude kind
# checks are not rules here: they belong to the scope model. The minimum-OS
# comparison across policy types is left out until the index can read the
# versions.
consistency:
  version: 1

  equivalences:
    # --- macOS password: compliance <-> legacy device restrictions <-> Settings Catalog
    #     (com.apple.mobiledevice.passwordpolicy) <-> custom profile (that payload type, presence
    #     only, so only in macos-password-required). 'enforced' on macOS: Learn documents the
    #     compliance password settings as remediated on the device.
    - id: macos-password-required
      description: Require a password to unlock macOS devices
      members:
        - '#microsoft.graph.macOSCompliancePolicy#passwordRequired'
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordRequired'
        - com.apple.mobiledevice.passwordpolicy_forcepin
        - '#microsoft.graph.macOSCustomConfiguration#com.apple.mobiledevice.passwordpolicy'
      relation: required
      enforced:
        macos: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: macos-password-minimum-length
      description: Minimum password length on macOS
      members:
        - '#microsoft.graph.macOSCompliancePolicy#passwordMinimumLength'
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordMinimumLength'
        - com.apple.mobiledevice.passwordpolicy_minlength
      relation: '>='
      enforced:
        macos: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: macos-password-inactivity-lock
      description: Maximum idle minutes before the macOS screen locks and the password is required
      members:
        - '#microsoft.graph.macOSCompliancePolicy#passwordMinutesOfInactivityBeforeLock'
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordMinutesOfInactivityBeforeScreenTimeout'
        - com.apple.mobiledevice.passwordpolicy_maxinactivity
      relation: '<='
      enforced:
        macos: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: macos-password-expiration
      description: Password expiration (days) on macOS
      members:
        - '#microsoft.graph.macOSCompliancePolicy#passwordExpirationDays'
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordExpirationDays'
        - com.apple.mobiledevice.passwordpolicy_maxpinageindays
      relation: '<='
      enforced:
        macos: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: macos-password-history
      description: Number of previous passwords that cannot be reused on macOS
      members:
        - '#microsoft.graph.macOSCompliancePolicy#passwordPreviousPasswordBlockCount'
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordPreviousPasswordBlockCount'
        - com.apple.mobiledevice.passwordpolicy_pinhistory
      relation: '>='
      enforced:
        macos: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: macos-password-complex-characters
      description: Minimum number of non-alphanumeric (complex) characters in the macOS password
      members:
        - '#microsoft.graph.macOSCompliancePolicy#passwordMinimumCharacterSetCount'
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordMinimumCharacterSetCount'
        - com.apple.mobiledevice.passwordpolicy_mincomplexchars
      relation: '>='
      enforced:
        macos: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify

    # --- iOS/iPadOS passcode: compliance <-> legacy device restrictions <-> Settings Catalog
    #     (shared com.apple.mobiledevice.passwordpolicy keys; platform scopes keep macOS apart)
    #     <-> custom profile (that payload type, presence only, so only in ios-passcode-required).
    - id: ios-passcode-required
      description: Require a passcode to unlock iOS/iPadOS devices
      members:
        - '#microsoft.graph.iosCompliancePolicy#passcodeRequired'
        - '#microsoft.graph.iosGeneralDeviceConfiguration#passcodeRequired'
        - com.apple.mobiledevice.passwordpolicy_forcepin
        - '#microsoft.graph.iosCustomConfiguration#com.apple.mobiledevice.passwordpolicy'
      relation: required
      enforced:
        ios: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-ios-ipados-settings
      status: verify
    - id: ios-passcode-minimum-length
      description: Minimum passcode length on iOS/iPadOS
      members:
        - '#microsoft.graph.iosCompliancePolicy#passcodeMinimumLength'
        - '#microsoft.graph.iosGeneralDeviceConfiguration#passcodeMinimumLength'
        - com.apple.mobiledevice.passwordpolicy_minlength
      relation: '>='
      enforced:
        ios: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-ios-ipados-settings
      status: verify
    - id: ios-passcode-inactivity-lock
      description: Maximum idle minutes until the iOS/iPadOS screen auto-locks
      members:
        - '#microsoft.graph.iosCompliancePolicy#passcodeMinutesOfInactivityBeforeScreenTimeout'
        - '#microsoft.graph.iosGeneralDeviceConfiguration#passcodeMinutesOfInactivityBeforeScreenTimeout'
        - com.apple.mobiledevice.passwordpolicy_maxinactivity
      relation: '<='
      enforced:
        ios: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-ios-ipados-settings
      status: verify
    - id: ios-passcode-expiration
      description: Passcode expiration (days) on iOS/iPadOS
      members:
        - '#microsoft.graph.iosCompliancePolicy#passcodeExpirationDays'
        - '#microsoft.graph.iosGeneralDeviceConfiguration#passcodeExpirationDays'
        - com.apple.mobiledevice.passwordpolicy_maxpinageindays
      relation: '<='
      enforced:
        ios: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-ios-ipados-settings
      status: verify
    - id: ios-passcode-history
      description: Number of previous passcodes that cannot be reused on iOS/iPadOS
      members:
        - '#microsoft.graph.iosCompliancePolicy#passcodePreviousPasscodeBlockCount'
        - '#microsoft.graph.iosGeneralDeviceConfiguration#passcodePreviousPasscodeBlockCount'
        - com.apple.mobiledevice.passwordpolicy_pinhistory
      relation: '>='
      enforced:
        ios: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-ios-ipados-settings
      status: verify

    # --- Encryption and firewall: compliance requirement <-> configuration that satisfies it.
    - id: macos-filevault
      description: FileVault disk encryption on macOS (compliance requires, configuration enables; encryption starts at the user's next sign-out)
      members:
        - '#microsoft.graph.macOSCompliancePolicy#storageRequireEncryption'
        - '#microsoft.graph.macOSEndpointProtectionConfiguration#fileVaultEnabled'
        - com.apple.mcx.filevault2_enable
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/endpoint-security/encrypt-filevault-macos
      status: verify
    - id: windows-device-encryption
      description: BitLocker OS-drive encryption on Windows (compliance checks DeviceStatus EncryptionCompliance; configuration enables via BitLocker CSP)
      members:
        - '#microsoft.graph.windows10CompliancePolicy#storageRequireEncryption'
        - '#microsoft.graph.windows10EndpointProtectionConfiguration#bitLockerEncryptDevice'
        - device_vendor_msft_bitlocker_requiredeviceencryption
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-windows-settings
      status: verify
    - id: macos-firewall
      description: macOS application firewall turned on
      members:
        - '#microsoft.graph.macOSCompliancePolicy#firewallEnabled'
        - '#microsoft.graph.macOSEndpointProtectionConfiguration#firewallEnabled'
        - com.apple.security.firewall_enablefirewall
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: windows-firewall-domain
      description: Windows Defender Firewall turned on for the domain profile
      members:
        - '#microsoft.graph.windows10CompliancePolicy#activeFirewallRequired'
        - vendor_msft_firewall_mdmstore_domainprofile_enablefirewall
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-windows-settings
      status: verify
    - id: windows-firewall-private
      description: Windows Defender Firewall turned on for the private profile
      members:
        - '#microsoft.graph.windows10CompliancePolicy#activeFirewallRequired'
        - vendor_msft_firewall_mdmstore_privateprofile_enablefirewall
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-windows-settings
      status: verify
    - id: windows-firewall-public
      description: Windows Defender Firewall turned on for the public profile
      members:
        - '#microsoft.graph.windows10CompliancePolicy#activeFirewallRequired'
        - vendor_msft_firewall_mdmstore_publicprofile_enablefirewall
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-windows-settings
      status: verify

    # --- Further password / passcode settings (Apple payload keys; legacy-template pairs).
    - id: macos-password-type
      description: Alphanumeric password required on macOS
      members:
        - '#microsoft.graph.macOSCompliancePolicy#passwordRequiredType'
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordRequiredType'
        - com.apple.mobiledevice.passwordpolicy_requirealphanumeric
      relation: required
      enforced:
        macos: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: ios-passcode-grace-period
      description: Maximum minutes after screen lock before the iOS/iPadOS passcode is required
      members:
        - '#microsoft.graph.iosCompliancePolicy#passcodeMinutesOfInactivityBeforeLock'
        - '#microsoft.graph.iosGeneralDeviceConfiguration#passcodeMinutesOfInactivityBeforeLock'
        - com.apple.mobiledevice.passwordpolicy_maxgraceperiod
      relation: '<='
      enforced:
        ios: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-ios-ipados-settings
      status: verify
    - id: macos-password-grace-period
      description: Maximum minutes after macOS screen lock before the password is required
      members:
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordMinutesOfInactivityBeforeLock'
        - com.apple.mobiledevice.passwordpolicy_maxgraceperiod
      relation: same
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/templates/ref-device-restrictions-apple
      status: verify
    - id: macos-password-max-failed-attempts
      description: Failed sign-in attempts before macOS locks
      members:
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordMaximumAttemptCount'
        - com.apple.mobiledevice.passwordpolicy_maxfailedattempts
      relation: same
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/templates/ref-device-restrictions-apple
      status: verify
    - id: macos-password-lockout-duration
      description: Minutes until a macOS login lockout resets
      members:
        - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordMinutesUntilFailedLoginReset'
        - com.apple.mobiledevice.passwordpolicy_minutesuntilfailedloginreset
      relation: same
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/templates/ref-device-restrictions-apple
      status: verify

    # --- Windows BitLocker (Device Health Attestation) and macOS firewall extras.
    - id: windows-bitlocker-dha
      description: '"Require BitLocker" via Device Health Attestation (measured at boot) is satisfied only by a configuration that enables BitLocker'
      members:
        - '#microsoft.graph.windows10CompliancePolicy#bitLockerEnabled'
        - device_vendor_msft_bitlocker_requiredeviceencryption
        - '#microsoft.graph.windows10EndpointProtectionConfiguration#bitLockerEncryptDevice'
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-windows-settings
      status: verify
    - id: macos-firewall-stealth-mode
      description: macOS firewall stealth mode turned on
      members:
        - '#microsoft.graph.macOSCompliancePolicy#firewallEnableStealthMode'
        - '#microsoft.graph.macOSEndpointProtectionConfiguration#firewallEnableStealthMode'
        - com.apple.security.firewall_enablestealthmode
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: macos-firewall-block-all-incoming
      description: macOS firewall blocks all incoming connections
      members:
        - '#microsoft.graph.macOSCompliancePolicy#firewallBlockAllIncoming'
        - '#microsoft.graph.macOSEndpointProtectionConfiguration#firewallBlockAllIncoming'
        - com.apple.security.firewall_blockallincoming
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify

    # --- Defender: compliance <-> configuration, and the same setting through two CSP surfaces.
    - id: windows-defender-realtime-protection
      description: Windows compliance "Real-time protection" ↔ Defender real-time monitoring configuration
      members:
        - '#microsoft.graph.windows10CompliancePolicy#rtpEnabled'
        - device_vendor_msft_policy_config_defender_allowrealtimemonitoring
        - '#microsoft.graph.windows10GeneralConfiguration#defenderRequireRealTimeMonitoring'
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-windows-settings
      status: verify
    - id: windows-defender-cloud-protection-maps
      description: Defender cloud protection (MAPS) set by Policy CSP and by the ADMX-backed Policy CSP node — same GP setting
      members:
        - device_vendor_msft_policy_config_defender_allowcloudprotection
        - device_vendor_msft_policy_config_admx_microsoftdefenderantivirus_spynetreporting
      relation: same
      reference: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-defender
      status: verified
    - id: windows-defender-realtime-admx
      description: Defender real-time monitoring set by Policy CSP and by the ADMX-backed "Turn off real-time protection" node (inverse polarity)
      members:
        - device_vendor_msft_policy_config_defender_allowrealtimemonitoring
        - device_vendor_msft_policy_config_admx_microsoftdefenderantivirus_disablerealtimemonitoring
      relation: same
      reference: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-microsoftdefenderantivirus
      status: verified
    - id: windows-defender-local-admin-merge
      description: Defender "local admin merge" for list settings, via Defender CSP and via ADMX-backed Policy CSP
      members:
        - device_vendor_msft_defender_configuration_disablelocaladminmerge
        - device_vendor_msft_policy_config_admx_microsoftdefenderantivirus_disablelocaladminmerge
      relation: same
      reference: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp
      status: verify
    - id: macos-defender-realtime-protection-deprecated
      description: macOS Defender real-time protection — deprecated enableRealTimeProtection vs its replacement antivirusEngine enforcementLevel
      members:
        - com.apple.managedclient.preferences_enablerealtimeprotection
        - com.apple.managedclient.preferences_enforcementlevel_antivirusengine
      relation: same
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/endpoint-security/ref-antivirus-defender-settings-macos
      status: verify

    # --- Windows password: compliance <-> DeviceLock CSP.
    - id: windows-password-minimum-length
      description: Minimum password length on Windows (compliance vs DeviceLock CSP)
      members:
        - '#microsoft.graph.windows10CompliancePolicy#passwordMinimumLength'
        - device_vendor_msft_policy_config_devicelock_mindevicepasswordlength
      relation: '>='
      enforced:
        windows: true
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-windows-settings
      status: verify
    - id: windows-password-inactivity-lock
      description: Idle minutes before the Windows device locks / requires the password
      members:
        - '#microsoft.graph.windows10CompliancePolicy#passwordMinutesOfInactivityBeforeLock'
        - device_vendor_msft_policy_config_devicelock_maxinactivitytimedevicelock
      relation: '<='
      enforced:
        windows: true
      reference: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-devicelock
      status: verify
    - id: windows-password-history
      description: Number of previous passwords that can't be reused on Windows
      members:
        - '#microsoft.graph.windows10CompliancePolicy#passwordPreviousPasswordBlockCount'
        - device_vendor_msft_policy_config_devicelock_devicepasswordhistory
      relation: '>='
      enforced:
        windows: true
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/templates/ref-device-restrictions-windows
      status: verify
    - id: windows-password-expiration
      description: Maximum password age in days on Windows
      members:
        - '#microsoft.graph.windows10CompliancePolicy#passwordExpirationDays'
        - device_vendor_msft_policy_config_devicelock_devicepasswordexpiration
      relation: '<='
      enforced:
        windows: true
      reference: https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-devicelock
      status: verify

    # --- macOS Gatekeeper and system extensions.
    - id: macos-gatekeeper-enabled
      description: Gatekeeper must be on when compliance restricts app sources
      members:
        - '#microsoft.graph.macOSCompliancePolicy#gatekeeperAllowedAppSource'
        - com.apple.systempolicy.control_enableassessment
        - '#microsoft.graph.macOSEndpointProtectionConfiguration#gatekeeperAllowedAppSource'
      relation: required
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: macos-gatekeeper-block-override
      description: Prevent users overriding Gatekeeper (Finder Control-click open)
      members:
        - com.apple.systempolicy.managed_disableoverride
        - '#microsoft.graph.macOSEndpointProtectionConfiguration#gatekeeperBlockOverride'
      relation: same
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/endpoint-security/ref-endpoint-protection-macos
      status: verify
    - id: macos-system-extensions-allowed
      description: Allowed system extensions — legacy Extensions template vs custom system-extension-policy payload
      members:
        - '#microsoft.graph.macOSExtensionsConfiguration#systemExtensionsAllowed'
        - '#microsoft.graph.macOSCustomConfiguration#com.apple.system-extension-policy'
      relation: same
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/templates/ref-kernel-extensions-settings-macos
      status: verify

  topics:
    # Topics: how resources group for the topic-based rules.
    - id: encryption
      label: Encryption
      match:
        - key: (?:bitlocker|filevault|storagerequireencryption|fderecoverykeyescrow|dontallowfde|fvkeyonstandby)
        - name: (?:bitlocker|filevault|disk ?encryption)
          type: Microsoft.Graph/deviceManagementIntents
    - id: defender-edr
      label: Defender / EDR
      match:
        - name: (?i)(?:mde|defender|\bngp\b|\basr\b|\bedr\b)
        - key: (?i)(?:defender|antivirus|antispyware|rtpenabled|signatureoutofdate|devicethreatprotection|advancedthreatprotection|#com\.microsoft\.wdav(?:\.atp)?$|^com\.apple\.managedclient\.preferences_(?:enforcementlevel_antivirusengine|enablerealtimeprotection|enforcementlevel_tamperprotection|cloudblocklevel|threattypesettings|disallowedthreatactions|automaticdefinitionupdateenabled|scanafterdefinitionupdate))
        - type: Microsoft.Graph/mobileThreatDefenseConnectors
    - id: firewall
      label: Firewall
      match:
        - key: ^vendor_msft_firewall_mdmstore_(domainprofile|privateprofile|publicprofile)_
        - key: ^com\.apple\.security\.firewall_
        - key: ^#microsoft\.graph\.windows10CompliancePolicy#activeFirewallRequired$
        - key: ^#microsoft\.graph\.(macOSCompliancePolicy|macOSEndpointProtectionConfiguration)#firewall
        - key: ^#microsoft\.graph\.windows10EndpointProtectionConfiguration#firewallProfile(Domain|Private|Public)\.
    - id: windows-update
      label: Windows Update
      match:
        - name: (?:updatering|windows-update)
        - odataType: windowsUpdateForBusinessConfiguration
        - type: Microsoft.Graph/windowsFeatureUpdateProfiles
        - type: Microsoft.Graph/windowsDriverUpdateProfiles
    - id: identity-sign-in
      label: Identity & sign-in
      match:
        - type: Microsoft.Graph/conditionalAccessPolicies
        - type: Microsoft.Graph/authenticationStrengthPolicies
        - type: Microsoft.Graph/authenticationMethodsPolicy
        - key: (?i)(?:passportforwork|windowshello)
        - odataType: windowsIdentityProtectionConfiguration$
    - id: browsers
      label: Browsers
      match:
        - name: (?i)(?:\bedge\b|chrome|firefox|safari|browser)
        - key: (?:microsoft_edge|com\.apple\.safari|google_?chrome|firefox)
        - platforms: macos
          key: ^com\.apple\.managedclient\.preferences_(?:smartscreenenabled|clearbrowsingdataonexit|autofillcreditcardenabled|autofillsettings)$
    - id: office-onedrive
      label: Office / OneDrive
      match:
        - name: (?i)(?:office|onedrive|m365|microsoft 365)
        - key: (?:onedrive|_(?:access|excel|lync|office|onent|outlk|ppt|proj|pub|visio|word)16v2~|office16|com\.microsoft\.office)
        - platforms: macos
          key: ^com\.apple\.managedclient\.preferences_(?:channelname|acknowledgeddatacollectionpolicy|updatedeadline\.[a-z]+)$
    - id: enrollment
      label: Enrollment & Autopilot
      match:
        - name: (?:autopilot|enrollment|\besp\b)
        - type: Microsoft.Graph/windowsAutopilotDeploymentProfiles
        - type: Microsoft.Graph/deviceEnrollmentConfigurations
        - type: Microsoft.Graph/depOnboardingSettings
    - id: macos-accounts-sso
      label: macOS accounts & SSO
      match:
        - platforms: macos
          key: ^(?:com\.apple\.extensiblesso|com\.apple\.loginwindow|com\.apple\.mcx_disableguestaccount$|ade_accountsettings_|ade_macos_authenticationmethod$)
        - platforms: macos
          key: ^#microsoft\.graph\.macOSDeviceFeaturesConfiguration#(?:macOSSingleSignOnExtension|singleSignOnExtension|adminShowHostInfo|loginWindowText|authorizedUsersList|consoleAccessDisabled)
    - id: compliance
      label: Compliance
      match:
        - type: Microsoft.Graph/deviceCompliancePolicies
        - type: Microsoft.Graph/compliancePolicies

    # Single-type topics the update and Conditional Access rules refer to.
    - id: windows-feature-update-policy
      label: Windows feature update policies
      match:
        - type: Microsoft.Graph/windowsFeatureUpdateProfiles
    - id: windows-driver-update-policy
      label: Windows driver update policies
      match:
        - type: Microsoft.Graph/windowsDriverUpdateProfiles
    - id: conditional-access
      label: Conditional Access
      match:
        - type: Microsoft.Graph/conditionalAccessPolicies

  rules:
    # --- Requirement without configuration (compliance asks, nothing delivers).
    - id: r1-defender
      description: Windows compliance requires Defender Antimalware / real-time protection / current signatures, but no Defender antivirus configuration reaches the scope
      left:
        keys:
          - '#microsoft.graph.windows10CompliancePolicy#defenderEnabled'
          - '#microsoft.graph.windows10CompliancePolicy#rtpEnabled'
          - '#microsoft.graph.windows10CompliancePolicy#signatureOutOfDate'
        class: requirement
        platforms: windows
      right:
        topic: defender-edr
        class: configuration
        platforms: windows
      violation: A compliance policy requires Defender Antimalware, real-time protection or up-to-date security intelligence for a scope that no Defender antivirus configuration reaches
      resolution: Compliance only evaluates. RTP is on by default (AllowRealtimeMonitoring default 1), so the device can still be compliant. It turns noncompliant when a GPO or local change turns RTP off, or when a non-Microsoft AV registered with Windows Security Center puts Defender into disabled or passive mode. Manage the state with an endpoint-security Antivirus or Settings Catalog Defender policy (Defender/AllowRealtimeMonitoring = 1) plus tamper protection.
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-windows-settings
      status: verify
    - id: r1-firewall
      description: macOS compliance requires the firewall but no firewall configuration reaches the scope
      left:
        topic: firewall
        class: requirement
        platforms: macos
      right:
        topic: firewall
        class: configuration
        platforms: macos
      violation: A compliance policy requires the macOS firewall for a scope that no firewall configuration reaches
      resolution: The macOS firewall is off by default and Learn does not document the compliance setting turning it on; deploy a com.apple.security.firewall configuration (Settings Catalog or endpoint security macOS firewall) to the same scope or the devices stay noncompliant
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: r2-minimum-os-above-updates
      description: Windows compliance minimum OS version vs the version a feature update policy targets
      left:
        keys:
          - '#microsoft.graph.windows10CompliancePolicy#osMinimumVersion'
        class: requirement
        platforms: windows
      right:
        topic: windows-feature-update-policy
      violation: The minimum OS version a compliance policy requires is newer than the Windows version the in-scope feature update policy targets
      resolution: The feature update policy decides which version Windows Update offers and never downgrades; compliance only evaluates, so devices held at the targeted version stay noncompliant until the policy target is raised or the compliance minimum lowered
      reference: https://learn.microsoft.com/en-us/intune/device-updates/windows/configure-feature-update-policy
      status: verify
    - id: r3-ca-compliant-device-without-compliance
      description: Conditional Access requires a compliant device, but users/platforms in its scope may receive no compliance policy
      left:
        topic: conditional-access
      right:
        topic: compliance
      violation: A conditional access policy grants on a compliant device for users or platforms that no compliance policy is assigned to
      resolution: 'Decided by the tenant-wide "Mark devices with no compliance policy assigned as" (deviceManagement.settings.secureByDefault). Compliant (default, secureByDefault=false): an enrolled device with no compliance policy counts as compliant, so the "Require device to be marked as compliant" grant is satisfied without any posture check. Not compliant (true): the device is noncompliant and Conditional Access blocks the sign-in, unless the policy uses "Require one of the selected controls" and another control is met. Either way, devices not registered in Entra ID / not enrolled in Intune, and platforms other than Windows 10+, iOS, Android, macOS and Linux Ubuntu, never satisfy the control. Fix: assign a compliance policy for the platform to those users'' devices and set the tenant setting to Not compliant.'
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/overview
      status: verify

    # --- The same setting delivered by more than one surface.
    - id: r4-encryption-surfaces
      description: The same encryption switch is set through a legacy typed profile and through the CSP / Settings Catalog
      left:
        keys:
          - '#microsoft.graph.windows10EndpointProtectionConfiguration#bitLockerEncryptDevice'
          - '#microsoft.graph.macOSEndpointProtectionConfiguration#fileVaultEnabled'
        class: configuration
      right:
        keys:
          - device_vendor_msft_bitlocker_requiredeviceencryption
          - com.apple.mcx.filevault2_enable
        class: configuration
      violation: A legacy endpoint-protection profile and a Settings Catalog / endpoint-security / OMA-URI policy set the same encryption switch to different values for overlapping scopes
      resolution: All policy types have equal precedence; Intune flags the setting as Conflict and it may not be applied at all (neither value is guaranteed). Equal values are not a conflict. Configure encryption in one surface only
      reference: https://learn.microsoft.com/en-us/intune/device-security/endpoint-security-policies
      status: verify
    - id: r4-firewall-surfaces
      description: Windows Firewall profile settings delivered by more than one policy type
      left:
        topic: firewall
        class: configuration
        platforms: windows
      right:
        topic: firewall
        class: configuration
        platforms: windows
      violation: Two configurations of different kinds set the same Windows Firewall profile setting to different values for overlapping scopes
      resolution: When two policy instances or types set the same firewall setting with different values, Intune does not send the setting to the device; keep one policy (firewall rules profiles are exempt and merge)
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/endpoint-security/firewall
      status: verify

    # --- Windows Update rings vs feature / driver update policies, and Apple update enforcement.
    - id: r5-deferral-with-feature-profile
      description: Update ring feature update deferral where a feature update policy also applies
      left:
        keys:
          - '#microsoft.graph.windowsUpdateForBusinessConfiguration#featureUpdatesDeferralPeriodInDays'
        class: configuration
        platforms: windows
      right:
        topic: windows-feature-update-policy
      violation: An update ring sets a feature update deferral greater than zero for devices a feature update policy also targets
      resolution: Windows Update evaluates both policies and the ring deferral can delay or block the feature update the policy targets; Microsoft recommends a ring feature deferral of 0 where a feature update policy applies, with feature update policies as the primary version control and rings governing restart, deadline and active-hours behaviour only
      reference: https://learn.microsoft.com/en-us/intune/device-updates/windows/configure-feature-update-policy
      status: verified

    # --- Encryption prerequisites (BitLocker, FileVault).
    - id: r1-encryption-windows
      description: Windows encryption is required by compliance but enabled by no configuration
      left:
        keys:
          - '#microsoft.graph.windows10CompliancePolicy#storageRequireEncryption'
          - '#microsoft.graph.windows10CompliancePolicy#bitLockerEnabled'
        class: requirement
        platforms: windows
      right:
        keys:
          - device_vendor_msft_bitlocker_requiredeviceencryption
          - '#microsoft.graph.windows10EndpointProtectionConfiguration#bitLockerEncryptDevice'
        class: configuration
        platforms: windows
      violation: A compliance policy requires BitLocker for a scope that no configuration enabling BitLocker (RequireDeviceEncryption) reaches
      resolution: Compliance only evaluates; without a configuration that enables BitLocker the device stays non-compliant. With "Require BitLocker" (DHA) the state is measured at boot, so even an encrypted device needs a reboot before it reports compliant
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-windows-settings
      status: verify
    - id: r1-encryption-macos
      description: macOS encryption is required by compliance but enabled by no configuration
      left:
        keys:
          - '#microsoft.graph.macOSCompliancePolicy#storageRequireEncryption'
        class: requirement
        platforms: macos
      right:
        keys:
          - com.apple.mcx.filevault2_enable
          - '#microsoft.graph.macOSEndpointProtectionConfiguration#fileVaultEnabled'
        class: configuration
        platforms: macos
      violation: A compliance policy requires encryption for a scope that no configuration enabling FileVault reaches
      resolution: Compliance only evaluates; without a configuration that enables FileVault the device stays non-compliant. FileVault encrypts only after the user's next sign-out, so the device is non-compliant until then
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/endpoint-security/encrypt-filevault-macos
      status: verify
    - id: r-bitlocker-silent-standard-user
      description: Silent BitLocker without standard-user encryption skips devices where a standard user is signed in
      left:
        keys:
          - device_vendor_msft_bitlocker_allowwarningforotherdiskencryption
        class: configuration
        platforms: windows
      right:
        keys:
          - device_vendor_msft_bitlocker_allowstandarduserencryption
        class: configuration
        platforms: windows
      violation: Silent BitLocker (AllowWarningForOtherDiskEncryption = 0) reaches a scope that no AllowStandardUserEncryption = 1 reaches
      resolution: With AllowStandardUserEncryption unset or 0, RequireDeviceEncryption "won't try to enable encryption on any drive" while a standard user is signed in; the device stays unencrypted and non-compliant. Set Allow Standard User Encryption = Enabled
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/endpoint-security/encrypt-bitlocker-windows
      status: verify
    - id: r-filevault-defer-required
      description: FileVault enabled through MDM without Defer is not applied
      left:
        keys:
          - com.apple.mcx.filevault2_enable
          - com.apple.mcx.filevault2_forceenableinsetupassistant
        class: configuration
        platforms: macos
      right:
        keys:
          - com.apple.mcx.filevault2_defer
        class: configuration
        platforms: macos
      violation: FileVault Enable / Force Enable in Setup Assistant reaches a scope that no FileVault Defer = Enabled reaches
      resolution: An Enable=On payload sent through MDM needs Defer=true (Intune supplies no user credentials); without it FileVault is not enabled, and on macOS 14.4 Setup Assistant enforcement fails. Set Defer = Enabled in the same policy
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/endpoint-security/encrypt-filevault-macos
      status: verify
    - id: r4-firewall-surfaces-macos
      description: macOS firewall payload delivered by more than one configuration
      left:
        topic: firewall
        class: configuration
        platforms: macos
      right:
        topic: firewall
        class: configuration
        platforms: macos
      violation: Two configurations deliver the macOS firewall payload for overlapping scopes
      resolution: macOS applies the most restrictive union of all com.apple.security.firewall payloads, so the less restrictive values are silently ignored; keep one surface
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/endpoint-security/ref-endpoint-protection-macos
      status: verify
    - id: r5b-ring-feature-pause-with-feature-profile
      description: Update ring pauses feature updates where a feature update policy applies
      left:
        keys:
          - '#microsoft.graph.windowsUpdateForBusinessConfiguration#featureUpdatesPaused'
        class: configuration
        platforms: windows
      right:
        topic: windows-feature-update-policy
      violation: An update ring pauses feature updates for devices a feature update policy also targets
      resolution: The ring pause (up to 35 days) holds back the feature update the policy targets; Learn says to ensure feature updates in the update ring aren't paused when a feature update policy applies
      reference: https://learn.microsoft.com/en-us/intune/device-updates/windows/manage-feature-updates
      status: verified
    - id: r5c-ring-driver-exclusion-with-driver-policy
      description: Windows Update driver exclusion where a driver update policy applies
      left:
        keys:
          - '#microsoft.graph.windowsUpdateForBusinessConfiguration#driversExcluded'
          - device_vendor_msft_policy_config_update_excludewudriversinqualityupdate
        class: configuration
        platforms: windows
      right:
        topic: windows-driver-update-policy
      violation: An update ring (Windows drivers = Block) or a Settings Catalog policy (Exclude WU Drivers in Quality Update) excludes Windows Update drivers for devices a driver update policy targets
      resolution: The exclusion blocks installation of the drivers the driver update policy approves; Learn requires the ring's Windows driver setting = Allow and Exclude WU Drivers in Quality Update = Allow Windows Update drivers
      reference: https://learn.microsoft.com/en-us/intune/device-updates/windows/configure-driver-update-policy
      status: verified
    - id: r5d-overlapping-feature-update-policies
      description: Several feature update policies reach the same device
      left:
        topic: windows-feature-update-policy
      right:
        topic: windows-feature-update-policy
      violation: Two feature update policies targeting different Windows versions reach the same device
      resolution: Windows Update offers one feature update at a time and always the latest applicable version (Windows 11 beats Windows 10); the lower-version policy has no effect on that device. Same version Required + Optional is offered as Required
      reference: https://learn.microsoft.com/en-us/intune/device-updates/windows/configure-feature-update-policy
      status: verified
    - id: r5e-apple-enforcement-ignores-update-settings
      description: An Apple DDM update enforcement makes the device ignore Software Update Settings automatic actions
      left:
        keys:
          - ddm-latestsoftwareupdate_enforcelatestsoftwareupdateversion
          - ddm-latestsoftwareupdate_delayindays
          - ddm-latestsoftwareupdate_installtime
        class: configuration
        platforms: macos|ios
      right:
        keys:
          - softwareupdate_automaticactions
          - softwareupdate_automaticactions_download
          - softwareupdate_automaticactions_installosupdates
          - softwareupdate_automaticactions_installsecurityupdate
        class: configuration
        platforms: macos|ios
      violation: A DDM update enforcement (Software Update Enforce Latest) and Software Update Settings automatic actions reach the same device
      resolution: The enforcement wins; the device ignores software update settings including automatic update actions, and may install before the deadline when idle
      reference: https://learn.microsoft.com/en-us/intune/device-updates/apple/
      status: verified

    # --- Defender for Endpoint and macOS Defender surfaces.
    - id: r1-defender-threat-level
      description: Windows compliance requires an MDE machine risk score, but no MDE onboarding configuration reaches the scope
      left:
        keys:
          - '#microsoft.graph.windows10CompliancePolicy#deviceThreatProtectionEnabled'
          - '#microsoft.graph.windows10CompliancePolicy#deviceThreatProtectionRequiredSecurityLevel'
        class: requirement
        platforms: windows
      right:
        keys:
          - device_vendor_msft_windowsadvancedthreatprotection_onboarding_fromconnector
          - device_vendor_msft_windowsadvancedthreatprotection_configurationtype
          - device_vendor_msft_windowsadvancedthreatprotection_onboarding
        class: configuration
        platforms: windows
      violation: A compliance policy requires the device to be at or under an MDE machine risk score for a scope that no Defender for Endpoint onboarding (EDR) configuration reaches
      resolution: The risk score exists only for devices onboarded to Defender for Endpoint, and only when the Intune–MDE service connection is set up (integration steps 1–2). Onboard the scope with an EDR policy ("Auto from connector"). Onboarding by GPO, script or Configuration Manager is invisible to the export, so verify it in the Defender portal.
      reference: https://learn.microsoft.com/en-us/intune/device-security/microsoft-defender/configure-integration
      status: verify
    - id: r-macos-defender-two-surfaces
      description: macOS Defender preferences delivered both by Settings Catalog / endpoint-security preferences and by a custom com.microsoft.wdav profile
      left:
        keys:
          - com.apple.managedclient.preferences_enforcementlevel_antivirusengine
          - com.apple.managedclient.preferences_enablerealtimeprotection
          - com.apple.managedclient.preferences_enforcementlevel_tamperprotection
          - com.apple.managedclient.preferences_cloudblocklevel
          - com.apple.managedclient.preferences_threattypesettingsmergepolicy
          - com.apple.managedclient.preferences_disallowedthreatactions
          - com.apple.managedclient.preferences_automaticdefinitionupdateenabled
          - com.apple.managedclient.preferences_scanafterdefinitionupdate
        class: configuration
        platforms: macos
      right:
        keys:
          - '#microsoft.graph.macOSCustomConfiguration#com.microsoft.wdav'
        class: configuration
        platforms: macos
      violation: The same devices receive Defender for Endpoint antivirus preferences from both a Settings Catalog / endpoint-security Antivirus policy and a custom com.microsoft.wdav configuration profile
      resolution: Microsoft's Intune deployment guide says to configure Defender preferences by only one method (endpoint security policy, step 9a, or the custom com.microsoft.wdav profile, step 9b). Learn does not document which value wins when both deliver the same preference domain, so remove one surface.
      reference: https://learn.microsoft.com/en-us/defender-endpoint/mac-install-with-intune
      status: verify

    # --- Windows Hello for Business, LAPS and DeviceLock interplay.
    - id: r-whfb-user-over-device-enable
      description: '"Use Windows Hello for Business" set in both device and user scope'
      left:
        keys:
          - device_vendor_msft_passportforwork_{tenantid}_policies_usepassportforwork
        class: configuration
        platforms: windows
      right:
        keys:
          - user_vendor_msft_passportforwork_{tenantid}_policies_usepassportforwork
        class: configuration
        platforms: windows
      violation: The same Windows Hello for Business policy is configured for both the device and the user scope of the PassportForWork CSP
      resolution: The user-scope value wins; if a user policy is set the corresponding device (computer) policy is ignored, and the device value applies only where no user value is set
      reference: https://learn.microsoft.com/en-us/windows/security/identity-protection/hello-for-business/configure
      status: verified
    - id: r-whfb-user-over-device-minpinlength
      description: Minimum PIN length set in both device and user scope
      left:
        keys:
          - device_vendor_msft_passportforwork_{tenantid}_policies_pincomplexity_minimumpinlength
        class: configuration
        platforms: windows
      right:
        keys:
          - user_vendor_msft_passportforwork_{tenantid}_policies_pincomplexity_minimumpinlength
        class: configuration
        platforms: windows
      violation: Windows Hello for Business minimum PIN length is configured for both the device and the user scope
      resolution: The user-scope value wins; the device-scope value is ignored for users that receive a user value
      reference: https://learn.microsoft.com/en-us/windows/security/identity-protection/hello-for-business/configure
      status: verified
    - id: r-whfb-pin-vs-devicelock-length
      description: DeviceLock password length and Windows Hello for Business PIN length both configured
      left:
        keys:
          - device_vendor_msft_policy_config_devicelock_mindevicepasswordlength
        class: configuration
        platforms: windows
      right:
        keys:
          - device_vendor_msft_passportforwork_{tenantid}_policies_pincomplexity_minimumpinlength
          - user_vendor_msft_passportforwork_{tenantid}_policies_pincomplexity_minimumpinlength
        class: configuration
        platforms: windows
      violation: The device PIN length is governed by both the DeviceLock CSP and the PassportForWork CSP
      resolution: 'A device has a single PIN, governed by PassportForWork. Learn is inconsistent on the outcome: the PassportForWork CSP says its values take precedence over DeviceLock/EAS complexity rules; the WHfB configure page says Windows enforces the strictest of the governing policies. Align both values.'
      reference: https://learn.microsoft.com/en-us/windows/security/identity-protection/hello-for-business/configure
      status: verify
    - id: r-laps-adminname-ignored-by-automatic
      description: LAPS AdministratorAccountName set together with automatic account management
      left:
        keys:
          - device_vendor_msft_laps_policies_administratoraccountname
        class: configuration
        platforms: windows
      right:
        keys:
          - device_vendor_msft_laps_policies_automaticaccountmanagementenabled
        class: configuration
        platforms: windows
      violation: AdministratorAccountName is configured while automatic account management may be enabled
      resolution: When AutomaticAccountManagementEnabled is true, AdministratorAccountName is ignored and LAPS manages the account named by AutomaticAccountManagementNameOrPrefix / Target
      reference: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-management-policy-settings
      status: verify
    - id: r-laps-automatic-vs-rename-admin
      description: LAPS automatic account management and the "Rename administrator account" security option both act on the managed account
      left:
        keys:
          - device_vendor_msft_laps_policies_automaticaccountmanagementenabled
          - device_vendor_msft_laps_policies_automaticaccountmanagementtarget
        class: configuration
        platforms: windows
      right:
        keys:
          - device_vendor_msft_policy_config_localpoliciessecurityoptions_accounts_renameadministratoraccount
        class: configuration
        platforms: windows
      violation: A security-options policy renames the built-in Administrator while LAPS automatic account management targets that account (AutomaticAccountManagementTarget = 0)
      resolution: In automatic mode LAPS controls all configuration aspects of the managed account (including its name) and blocks external modification (STATUS_POLICY_CONTROLLED_ACCOUNT, events 10101-10104), so the rename does not apply. With Target = 1 (LAPS-created account, the default) the two settings act on different accounts and do not conflict.
      reference: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-concepts-account-management-modes
      status: verify
    - id: r-laps-adminname-vs-rename-admin
      description: LAPS AdministratorAccountName may point at the renamed built-in Administrator
      left:
        keys:
          - device_vendor_msft_laps_policies_administratoraccountname
        class: configuration
        platforms: windows
      right:
        keys:
          - device_vendor_msft_policy_config_localpoliciessecurityoptions_accounts_renameadministratoraccount
        class: configuration
        platforms: windows
      violation: AdministratorAccountName names the built-in Administrator (as renamed by the security option) instead of leaving it empty
      resolution: Leave AdministratorAccountName empty to manage the built-in Administrator; LAPS finds it by its well-known RID even when renamed. Set it only for a separate custom account, which must already exist
      reference: https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-management-policy-settings
      status: verify

    # --- macOS Platform SSO, LAPS and ADE enrollment.
    - id: r8-macos-sso-password-sync-complexity
      description: Platform SSO password sync vs local password complexity (passcode payload or compliance)
      left:
        keys:
          - com.apple.extensiblesso_platformsso_authenticationmethod
          - com.apple.extensiblesso_authenticationmethod
        class: configuration
        platforms: macos
      right:
        keys:
          - com.apple.mobiledevice.passwordpolicy_minlength
          - com.apple.mobiledevice.passwordpolicy_requirealphanumeric
          - com.apple.mobiledevice.passwordpolicy_customregex
          - '#microsoft.graph.macOSCompliancePolicy#passwordRequiredType'
          - '#microsoft.graph.macOSCompliancePolicy#passwordMinimumLength'
          - '#microsoft.graph.macOSCompliancePolicy#passwordMinimumCharacterSetCount'
          - '#microsoft.graph.macOSCompliancePolicy#passwordBlockSimple'
        platforms: macos
      violation: With the Platform SSO Password authentication method the Entra password replaces the local password; an Intune passcode or compliance password rule more complex than the Entra password policy makes password sync fail and users are denied access (not applicable when the method is UserSecureEnclaveKey or SmartCard)
      resolution: Make the Intune passcode/compliance complexity identical to the Entra ID password policy; the local policy is applied and blocks the synced password, Entra does not adapt
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/settings-catalog/configure-platform-sso-macos
      status: verify
    - id: r8b-macos-compliance-password-expires-sso-laps
      description: Compliance/device-restriction password requirement vs Platform SSO- or LAPS-created local accounts
      left:
        keys:
          - '#microsoft.graph.macOSCompliancePolicy#passwordRequired'
          - '#microsoft.graph.macOSGeneralDeviceConfiguration#passwordRequired'
        platforms: macos
      right:
        keys:
          - com.apple.extensiblesso_platformsso_enablecreateuseratlogin
          - com.apple.extensiblesso_platformsso_enableregistrationduringsetup
          - ade_accountsettings_createlocaladmin
          - ade_accountsettings_createlocalprimary
        platforms: macos
      violation: Requiring a password in a macOS compliance policy (or device restriction template) expires the existing password of all local accounts, including those created by LAPS and Platform SSO (Change at next authentication is on by default), causing sign-in issues for newly created LAPS accounts
      resolution: Manage the local password with a Settings Catalog passcode policy with Change At Next Auth = False, and do not set password rules in compliance/device-restriction policies for these devices
      reference: https://learn.microsoft.com/en-us/intune/device-security/compliance/ref-macos-settings
      status: verify
    - id: r-macos-laps-admin-passcode-reset
      description: ADE local admin (LAPS) account vs any passcode profile (known issue < macOS 26.4)
      left:
        keys:
          - ade_accountsettings_createlocaladmin
          - ade_accountsettings_adminaccountpasswordrotation
        platforms: macos
      right:
        keys:
          - com.apple.mobiledevice.passwordpolicy_forcepin
          - com.apple.mobiledevice.passwordpolicy_minlength
          - com.apple.mobiledevice.passwordpolicy_maxpinageindays
        class: configuration
        platforms: macos
      violation: On macOS earlier than 26.4, an ADE-enrolled Mac with a configured local admin account and a targeted passcode profile prompts for an admin password reset even when Change at next auth is off or Max Age is set; Intune's stored LAPS password then diverges from the device
      resolution: Upgrade to macOS 26.4; until then rotate the admin password from Intune after the reset to resync
      reference: https://learn.microsoft.com/en-us/intune/device-security/laps/setup-macos
      status: verify
    - id: r-macos-psso-registration-ade-profile
      description: Platform SSO registration during Setup Assistant vs ADE enrollment policy settings
      left:
        keys:
          - com.apple.extensiblesso_platformsso_enableregistrationduringsetup
        class: configuration
        platforms: macos
      right:
        keys:
          - ade_macos_useraffinity
          - ade_macos_authenticationmethod
          - ade_macos_awaitconfiguration
          - ade_lockedenrollment
        platforms: macos
      violation: PSSO registration during Setup Assistant must not target userless ADE devices (unexpected enrollment, lost affinity) and requires an ADE profile with user affinity, Setup Assistant with modern authentication, Await final configuration = Yes and Locked enrollment = Yes; otherwise enrollment fails and the device must be wiped
      resolution: The ADE profile decides; set it to user affinity + modern auth + await final configuration + locked enrollment, assign PSSO policy, Company Portal LOB app and ADE profile to the same static user groups (macOS 26+)
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/settings-catalog/configure-platform-sso-during-enrollment
      status: verify
    - id: r-macos-psso-account-name-overrides-ade-account
      description: Platform SSO during ADE account-name mapping vs ADE enrollment policy local account name
      left:
        keys:
          - com.apple.extensiblesso_platformsso_enableregistrationduringsetup
          - com.apple.extensiblesso_platformsso_tokentousermapping_accountname
        class: configuration
        platforms: macos
      right:
        keys:
          - ade_accountsettings_primaryaccountname
          - ade_accountsettings_prefillaccountinfo
        platforms: macos
      violation: For Platform SSO during ADE, the PSSO Token To User Mapping > Account Name overwrites the local account name set in the ADE enrollment policy (LAPS account settings); an {{onPremisesSamAccountName}} value there is ignored
      resolution: PSSO wins; to keep onPremisesSamAccountName deploy Company Portal 2608.0+ and set Enable Create First User During Setup = false (users then authorize three times during enrollment)
      reference: https://learn.microsoft.com/en-us/intune/device-configuration/settings-catalog/configure-platform-sso-macos
      status: verify

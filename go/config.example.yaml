# Example BASE configuration file for azure-rd.
#
# Load it explicitly with --config, e.g.:
#   azure-rd resource download --config ~/.azure-rd/base.yaml
# or place it as base.yaml inside a config directory, where it is picked up by
# convention alongside the per-tenant profiles:
#   cp config.example.yaml ~/.azure-rd/base.yaml
#   azure-rd resource download --config-dir ~/.azure-rd --domain contoso.onmicrosoft.com
# Without either, no config file is read and the built-in defaults apply.
#
# This file holds GENERAL settings only: behaviour, tuning and the export
# format. TENANT-SCOPED settings (subscription, credentials, per-tenant
# filters) belong in a profile — see config.example.domain.yaml. Putting a
# tenant-scoped key here is a fatal error naming the key, and vice versa; the
# partition is enforced, not advisory, because a per-tenant transformer or
# output root silently breaks comparability and the export layout.
#
# Precedence (highest to lowest): CLI flag > tenant profile > this file >
# built-in default. There is no environment layer: AZURE_RD_* variables are NOT
# read, so a value exported for one tenant can never leak into another tenant's
# run. (LOG_LEVEL still sets log verbosity, because the logger reads it
# directly.)
#
# Only two settings here also have a flag, for the ad-hoc cases: --output
# (redirect one run elsewhere to compare) and --type (narrow one run). The flag
# replaces the configured value for that invocation.
#
# Every active value below is the tool's built-in default, so loading this file
# unmodified behaves exactly like running with no config at all — same output
# files and the same resources/metadata.yaml, including every hash. Change what
# you need; the comments describe what each key does and what a non-default
# value means. Settings that are dangerous or output-changing to leave enabled
# are documented but commented out — those are called out where they appear.

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

# Output directory for downloaded resources.
# The tool writes exclusively under <output>/<tenant-domain>/resources/, which
# also holds the export metadata (resources/metadata.yaml) and the per-type
# doc-prompt.md files. Anything you place elsewhere under <output> is left
# untouched (and never pruned).
#
# This is base-only on purpose: the tenant is already a subdirectory of it, so a
# per-tenant root would break the layout every docs command looks for.
# Override for a single run with --output (e.g. to download elsewhere and diff);
# that changes WHERE bytes land, never WHICH bytes are produced.
output: "./output"

# ---------------------------------------------------------------------------
# Concurrency and timeouts
# ---------------------------------------------------------------------------

# General worker count for the download pipeline.
#
# LEAVE THIS COMMENTED OUT unless you really want one number for every API: its
# mere PRESENCE is the signal that you chose a count deliberately, which
# overrides the per-API defaults below for mixed runs. Writing the default here
# would silently opt you out of ARM's 20.
#
# How the value is used when set:
#   - Acting on exactly ONE type: the API-specific count below wins.
#   - Several types or a full export: this value is used.
# To raise concurrency for a specific API, set workers-by-api instead.
#
# workers: 5

# Per-API worker counts.
# Microsoft Graph has strict rate limits, ARM is far more generous. More workers
# can SLOW a run down once throttling and exponential backoff kick in.
workers-by-api:
  microsoft-graph: 5          # for Microsoft.Graph/* resources
  azure-resource-manager: 20  # for Microsoft.* ARM resources

# Per-operation timeout in seconds.
# Applied around each individual resource fetch INCLUDING its retries — it is
# not a whole-run budget, so a large tenant does not need a larger value.
timeout: 300

# ---------------------------------------------------------------------------
# Selection — WHAT to act on
# ---------------------------------------------------------------------------

# Resource type filter. Empty = every registered resource type (a full export).
# Run 'azure-rd resource types' to see the registered types.
#
# Narrow a single run with --type (repeatable), which replaces this list for
# that invocation only. The two ARM selectors --resource-id and
# --resource-group are command-line only and have no key here: they are ad-hoc
# ("re-download this one resource"), and a forgotten entry in a file would
# silently scope every later run.
# Example:
#   type:
#     - Microsoft.Resources/resourceGroups
#     - Microsoft.Storage/storageAccounts
type: []

# ---------------------------------------------------------------------------
# Download behaviour
# ---------------------------------------------------------------------------

# Resolve masked Intune OMA-URI secrets to plaintext.
# WARNING: when true, decrypted secret values are written to the output files on
# disk in the clear. Requires DeviceManagementConfiguration.ReadWrite.All in the
# token. Leave false unless you specifically need the secret values.
#
# This has no flag on purpose: writing secrets to disk should be a decision
# recorded in a file you can review and diff, not something typed ad-hoc. It
# also changes the exported bytes, so a drift run must resolve secrets exactly
# as the baseline did — one setting, read by both, cannot disagree.
resolve-secrets: false

# Skip the per-type documentation prompts. Prompts ARE written by default.
# The writer creates one dedicated LLM documentation prompt per resource type,
# as "doc-prompt.md" inside each resource type's directory (e.g.
# output/<tenant>/resources/Microsoft.Graph/deviceConfigurations/doc-prompt.md).
# Each prompt is tailored to its type and asks an LLM to document every setting
# with best-practice guidance, Microsoft Learn links and fully expanded embedded
# payloads (e.g. configurationXml, omaSettings). Paste a prompt together with a
# resource YAML from the same directory into an LLM to generate documentation.
no-prompt: false

# Delete resource files that are no longer in the tenant.
# When true, after a COMPLETE, failure-free run the tool deletes files under
# resources/ for resources it establishes are gone (by comparing against the
# previous export recorded in resources/metadata.yaml) and drops their metadata
# entries. It refuses to run for an incomplete run or one with failures, only
# considers types this run fully listed, and never leaves resources/.
# Under --dry-run it deletes nothing and lists what it would remove.
#
# This is the tool's only delete path inside an export, and it has no flag for
# the same reason resolve-secrets does not: a destructive switch belongs in a
# file you can review, not on a command line. Keep a second base file if you
# prune only occasionally.
prune: false

# ---------------------------------------------------------------------------
# Transformers
# ---------------------------------------------------------------------------
# The list below IS the built-in default pipeline, written out explicitly. Each
# entry is a bare name, so it carries NO per-transformer settings and the tool
# applies each transformer's own defaults — byte-for-byte identical to running
# with no config file (including the transform-config hash recorded in
# resources/metadata.yaml). The default of every per-transformer setting is
# shown, commented out, further down.
#
# IMPORTANT: this key replaces the defaults wholesale — it is not merged. If you
# edit it, keep every transformer you still want, including base64-decode. An
# empty list (transformers: []) disables ALL transformers and exports raw Azure
# data.
#
# Available transformers:
#   cleaning          - remove properties and empty values
#   id-resolution     - resolve Azure resource IDs to friendly names
#                       (adds "<property>_name" beside each resolved ID)
#   name-sanitization - sanitize resource names for use as file names
#   base64-decode     - decode a base64 property (e.g. an Intune macOS profile
#                       payload) inline or into a sidecar file
transformers:
  - name: cleaning
  - name: id-resolution
  - name: name-sanitization
  - name: base64-decode

# Per-transformer settings and their built-in defaults (config-only). To change
# one, add the keys under the matching entry above. Spelling them out with these
# exact values behaves the same as the bare names above — but writing any of
# them changes the recorded transform-config hash, so only add the ones you
# actually override.
#
#   - name: cleaning
#     clean-empty: true         # remove keys with empty values (null, [], "", {})
#   - name: base64-decode
#     mode: inline              # inline = replace the value in the YAML
#                               # file   = write a decoded sidecar file instead
#     source-key: payload       # property holding the base64-encoded value
#     filename-key: payloadFileName  # file mode: property holding the file name
#     extension: .mobileconfig  # file mode: extension for the decoded file
#     remove-source: false      # file mode: drop the encoded key from the YAML
#
# Additional cleaning options (NOT defaults — add inside the cleaning entry
# above to use them):
#
#   - name: cleaning
#     remove-keys:              # remove these keys everywhere, recursively
#       - provisioningState
#       - etag
#       - systemData
#       - id
#     remove-keys-by-type:      # additional per-resource-type removals
#       Microsoft.Resources/resourceGroups:
#         - managedBy
#       Microsoft.Storage/storageAccounts:
#         - primaryEndpoints
#         - secondaryEndpoints
#     preserve-keys:            # exceptions kept even if matched by remove-keys
#       - properties.subnet.id
#       - metadata.id
#     replace:                  # replace a complex object with a nested value
#       - from: grantControls.authenticationStrength.displayName
#         to: grantControls.authenticationStrength
#       - from: properties.networkProfile.id
#         to: networkProfileId
#     clean-empty: true
#
# Transformers may also be given as a plain list of names when no per-transformer
# settings are needed (equivalent to the bare-name entries above):
#
#   transformers:
#     - cleaning
#     - id-resolution
#     - name-sanitization
#     - base64-decode

# ---------------------------------------------------------------------------
# Filters — see config.example.domain.yaml
# ---------------------------------------------------------------------------
# Per-resource-type property filters are TENANT-SCOPED and belong in a tenant
# profile, not here: the patterns encode one tenant's naming convention, and the
# filter configuration is hashed into the export metadata where it gates drift
# comparability. A `filters:` key in this file is rejected, naming the key.

# ---------------------------------------------------------------------------
# Taxonomy — grouping for 'docs generate-index'
# ---------------------------------------------------------------------------
# Classifies each exported resource along one or more AXES — independent facets
# such as PROGRAMME (real-world initiatives: CIS hardening, Defender, VPN, update
# rings) or PLATFORM (Windows, macOS, iOS) that span several resource types and
# are otherwise invisible in the per-endpoint layout. It is read ONLY by
# 'docs generate-index', which writes the classification into docs/index.yaml:
# the header gains a 'facets' registry (every axis, its values and per-tenant
# counts) and each resource gains a 'facets' map (axis id -> matched value ids).
# The download pipeline ignores it entirely, so it never affects a resource's
# YAML or any recorded fact.
#
# It records RULES, never facts, so editing it never requires re-downloading a
# tenant: change it and re-run 'docs generate-index' — the classification
# updates in place. Resources matching no value on an axis are reported as
# "uncategorised" for that axis.
#
# The default is NO taxonomy: with this key absent, generate-index emits no
# facets and falls back to per-type grouping. Leave it commented out — an active
# taxonomy changes docs/index.yaml, so spelling it out here would break the
# "loading this file == no config" guarantee.
#
# Structure (an axis has an id, a label and a list of values; each value has the
# same id/label/match shape a programme has):
#   taxonomy:
#     version: 1                     # schema version, must be >= 1
#     axes:                          # listed in DISPLAY ORDER
#       - id: <url-safe-token>       # stable axis id (lowercase, digits, hyphens)
#         label: <display name>      # human-readable axis name; safe to change
#         values:                    # listed in DISPLAY ORDER
#           - id: <url-safe-token>   # stable value id; NEVER reuse or rename it
#                                    # — it is a facet value in a URL
#             label: <display name>  # human-readable; safe to change any time
#             match:                 # a resource joins if ANY rule matches (OR);
#                                    # within a rule every set field matches (AND);
#                                    # each rule needs at least one field
#               - name: <regex>      # regex over displayName (case-insensitive)
#                 type: <exact type> # exact type, e.g. Microsoft.Graph/mobileApps
#                 odataType: <regex> # regex over @odata.type (case-insensitive)
#                 platforms: <regex> # regex over the platforms fact (case-insensitive)
#                 scope: device|user # exact device/user scope
#
# 'programmes:' is accepted as sugar for the axis with id 'programme' (its items
# become that axis's values). Defining BOTH 'programmes:' and an 'axes:' entry
# whose id is 'programme' is a fatal error, not a silent merge.
#
# Worked example (regexes single-quoted so \b, \d stay literal for the regex
# engine rather than being interpreted by YAML). The 'programme' axis is written
# with the programmes: sugar; a second 'platform' axis is spelled out under
# axes: to show multi-axis classification:
#
# taxonomy:
#   version: 1
#   programmes:                # -> the axis with id 'programme'
#     - id: cis-hardening
#       label: CIS hardening
#       match:
#         - name: '_cis_'
#         - name: '[_-]l1$'
#     - id: compliance
#       label: Compliance
#       match:
#         - name: 'validation'
#         - type: Microsoft.Graph/deviceCompliancePolicies
#     - id: defender
#       label: Defender / MDE
#       match:
#         - name: '(?:mde|defender|\bngp\b|\basr\b)'
#     - id: vpn
#       label: VPN
#       match:
#         - name: 'vpn'
#     - id: windows-update
#       label: Windows Update
#       match:
#         - name: '(?:updatering|windows-update)'
#         - type: Microsoft.Graph/windowsFeatureUpdateProfiles
#     - id: identity-access
#       label: Identity & conditional access
#       match:
#         - type: Microsoft.Graph/conditionalAccessPolicies
#         - name: '(?:\bca\d{2}|\bmfa\b|2fa|passwordless|whfb)'
#     - id: app-delivery
#       label: App delivery
#       match:
#         - type: Microsoft.Graph/mobileApps
#   axes:
#     - id: platform
#       label: Platform
#       values:
#         - id: windows
#           label: Windows
#           match:
#             - platforms: 'windows'
#         - id: macos
#           label: macOS
#           match:
#             - platforms: 'macOS'
#         - id: ios
#           label: iOS/iPadOS
#           match:
#             - platforms: '(?:ios|ipados)'

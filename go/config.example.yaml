# Example configuration file for Azure Resource Downloader
# Save it anywhere and load it explicitly with --config, e.g.:
#   azure-rd download --config ~/.azure-rd.yaml
# Without --config no config file is read and the built-in defaults apply.
#
# Precedence (highest to lowest): CLI flag > AZURE_RD_* env var > this file >
# built-in default. A higher source silently overrides a lower one (no warning).
# An unset flag does NOT clobber a configured value with the flag's default.
#
# Every value below is set to the tool's built-in default, so loading this file
# unmodified behaves exactly like running with no config at all. Change what you
# need; the comments describe what each key does and what a non-default value
# means. Keys that have NO usable default (credentials, selection filters) are
# present with empty values; a few that are dangerous to leave enabled are
# documented but commented out — those are called out where they appear.

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------

# Azure subscription ID.
# Empty = use the default subscription from your 'az login' session. With no
# subscription at all, Microsoft Graph types still download and ARM types are
# skipped with a warning.
# Equivalent to --subscription / AZURE_RD_SUBSCRIPTION.
subscription: ""

# Dedicated app registration for device-code sign-in.
# Empty = reuse the existing Azure CLI session (same delegated token for ARM and
# Microsoft Graph). Set BOTH values to sign in to your own app registration
# instead — needed for Microsoft Graph/Intune scopes the Azure CLI app cannot
# provide. If a selected resource type requires one and these are empty, the run
# prompts for them interactively.
# Equivalent to --client-id / --tenant-id.
client-id: ""     # app (client) ID
tenant-id: ""     # Entra tenant ID (required together with client-id)

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------

# Output directory for downloaded resources.
# The tool writes exclusively under <output>/<tenant-domain>/resources/, which
# also holds the export metadata (resources/metadata.yaml) and the per-type
# doc-prompt.md files. Anything you place elsewhere under <output> is left
# untouched (and never pruned).
# Equivalent to --output / AZURE_RD_OUTPUT.
output: "./output"

# Preview mode: run everything but write nothing to disk.
# Under dry-run the export metadata is not written and --prune deletes nothing;
# a dry run with prune enabled instead lists the files a real run would remove.
# Equivalent to --dry-run.
dry-run: false

# ---------------------------------------------------------------------------
# Concurrency and timeouts
# ---------------------------------------------------------------------------

# Worker count for the download pipeline.
#
# How this value is actually used:
#   - Downloading exactly ONE --type: the API-specific count below wins and this
#     value is ignored. Only the --workers FLAG overrides an API-specific count.
#   - Downloading several types or a full export: this value is used.
# To raise concurrency for a specific API, set workers-by-api instead.
# Equivalent to --workers / AZURE_RD_WORKERS.
workers: 5

# Per-API worker counts (config-only; there is no CLI flag).
# Microsoft Graph has strict rate limits, ARM is far more generous. More workers
# can SLOW a run down once throttling and exponential backoff kick in.
workers-by-api:
  microsoft-graph: 5          # for Microsoft.Graph/* resources
  azure-resource-manager: 20  # for Microsoft.* ARM resources

# Per-operation timeout in seconds.
# Applied around each individual resource fetch INCLUDING its retries — it is
# not a whole-run budget, so a large tenant does not need a larger value.
# Equivalent to --timeout / AZURE_RD_TIMEOUT.
timeout: 300

# ---------------------------------------------------------------------------
# Selection — WHAT to download
# ---------------------------------------------------------------------------
# If none of the three keys below is set, every registered resource type is
# downloaded (a full export). Run 'azure-rd list' to see the registered types.

# Explicit Azure resource IDs. Equivalent to repeating --resource-id.
# Example:
#   resource-id:
#     - "/subscriptions/<sub>/resourceGroups/my-rg/providers/Microsoft.Storage/storageAccounts/acct"
resource-id: []

# Resource type filter. Equivalent to repeating --type.
# Example:
#   type:
#     - Microsoft.Resources/resourceGroups
#     - Microsoft.Storage/storageAccounts
type: []

# Download the named resource group itself (ARM only).
# Equivalent to --resource-group.
resource-group: ""

# ---------------------------------------------------------------------------
# Download behaviour
# ---------------------------------------------------------------------------

# Resolve masked Intune OMA-URI secrets to plaintext.
# WARNING: when true, decrypted secret values are written to the output files on
# disk in the clear. Requires DeviceManagementConfiguration.ReadWrite.All in the
# token. Leave false unless you specifically need the secret values.
# Equivalent to --resolve-secrets.
resolve-secrets: false

# Skip the per-type documentation prompts. Prompts ARE written by default.
# The writer creates one dedicated LLM documentation prompt per resource type,
# as "doc-prompt.md" inside each resource type's directory (e.g.
# output/<tenant>/resources/Microsoft.Graph/deviceConfigurations/doc-prompt.md).
# Each prompt is tailored to its type and asks an LLM to document every setting
# with best-practice guidance, Microsoft Learn links and fully expanded embedded
# payloads (e.g. configurationXml, omaSettings). Paste a prompt together with a
# resource YAML from the same directory into an LLM to generate documentation.
# Equivalent to --no-prompt.
no-prompt: false

# Delete resource files that are no longer in the tenant.
# When true, after a COMPLETE, failure-free run the tool deletes files under
# resources/ for resources it establishes are gone (by comparing against the
# previous export recorded in resources/metadata.yaml) and drops their metadata
# entries. It refuses to run for an incomplete run or one with failures, only
# considers types this run fully listed, and never leaves resources/.
# Under --dry-run it deletes nothing and lists what it would remove.
# Equivalent to --prune.
prune: false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# Log verbosity. One of: debug, info, warn, error.
#   debug - maximum verbosity (all messages)
#   info  - normal operation (progress, metrics, warnings, errors)
#   warn  - warnings and errors only
#   error - errors only
# Equivalent to --log-level / AZURE_RD_LOG_LEVEL (LOG_LEVEL is also honoured).
log-level: "info"

# ---------------------------------------------------------------------------
# Transformers (config-only; there is no CLI flag)
# ---------------------------------------------------------------------------
# The list below IS the built-in default pipeline, written out explicitly. Each
# entry is a bare name, so it carries NO per-transformer settings and the tool
# applies each transformer's own defaults — byte-for-byte identical to running
# with no config file (including the transform-config hash recorded in
# resources/metadata.yaml). The default of every per-transformer setting is
# shown, commented out, further down.
#
# IMPORTANT: this key replaces the defaults wholesale — it is not merged. If you
# edit it, keep every transformer you still want, including base64-decode. An
# empty list (transformers: []) disables ALL transformers and exports raw Azure
# data.
#
# Available transformers:
#   cleaning          - remove properties and empty values
#   id-resolution     - resolve Azure resource IDs to friendly names
#                       (adds "<property>_name" beside each resolved ID)
#   name-sanitization - sanitize resource names for use as file names
#   base64-decode     - decode a base64 property (e.g. an Intune macOS profile
#                       payload) inline or into a sidecar file
transformers:
  - name: cleaning
  - name: id-resolution
  - name: name-sanitization
  - name: base64-decode

# Per-transformer settings and their built-in defaults (config-only). To change
# one, add the keys under the matching entry above. Spelling them out with these
# exact values behaves the same as the bare names above — but writing any of
# them changes the recorded transform-config hash, so only add the ones you
# actually override.
#
#   - name: cleaning
#     clean-empty: true         # remove keys with empty values (null, [], "", {})
#   - name: base64-decode
#     mode: inline              # inline = replace the value in the YAML
#                               # file   = write a decoded sidecar file instead
#     source-key: payload       # property holding the base64-encoded value
#     filename-key: payloadFileName  # file mode: property holding the file name
#     extension: .mobileconfig  # file mode: extension for the decoded file
#     remove-source: false      # file mode: drop the encoded key from the YAML
#
# Additional cleaning options (NOT defaults — add inside the cleaning entry
# above to use them):
#
#   - name: cleaning
#     remove-keys:              # remove these keys everywhere, recursively
#       - provisioningState
#       - etag
#       - systemData
#       - id
#     remove-keys-by-type:      # additional per-resource-type removals
#       Microsoft.Resources/resourceGroups:
#         - managedBy
#       Microsoft.Storage/storageAccounts:
#         - primaryEndpoints
#         - secondaryEndpoints
#     preserve-keys:            # exceptions kept even if matched by remove-keys
#       - properties.subnet.id
#       - metadata.id
#     replace:                  # replace a complex object with a nested value
#       - from: grantControls.authenticationStrength.displayName
#         to: grantControls.authenticationStrength
#       - from: properties.networkProfile.id
#         to: networkProfileId
#     clean-empty: true
#
# Transformers may also be given as a plain list of names when no per-transformer
# settings are needed (equivalent to the bare-name entries above):
#
#   transformers:
#     - cleaning
#     - id-resolution
#     - name-sanitization
#     - base64-decode

# ---------------------------------------------------------------------------
# Filters (config-only; there is no CLI flag)
# ---------------------------------------------------------------------------
# Restrict which resources are downloaded per resource type by matching one or
# more properties against a regular expression (Go RE2 syntax).
#
# Structure: filters.<resourceType>.<propertyPath>: <regex>
#   <resourceType>  a registered handler type (case-insensitive)
#   <propertyPath>  dot-separated path into the resource's raw properties
#                   (e.g. displayName or properties.subnet.id)
#   <regex>         a Go regular expression matched against the value
#
# A resource is downloaded only when EVERY listed property regex for its type
# matches (logical AND). Types without a filter are unaffected. Filters are
# evaluated after fetch, so the resource is still read from Azure — it is simply
# never written.
#
# The default is no filters. Leave this key commented out entirely: an empty or
# valueless "filters:" is not a valid filter map and is reported as ignored.
#
# filters:
#   # only export device configurations whose displayName starts with "GBL_"
#   Microsoft.Graph/deviceConfigurations:
#     displayName: "GBL_.*"
#
#   # combine multiple properties (both must match)
#   Microsoft.Graph/groups:
#     displayName: "^IT-.*"
#     mailEnabled: "true"
#
#   # anchor a regex for an exact prefix on storage accounts
#   Microsoft.Storage/storageAccounts:
#     name: "^prod"

# ---------------------------------------------------------------------------
# Taxonomy — grouping for 'docs generate-index' (config-only; there is no CLI flag)
# ---------------------------------------------------------------------------
# Classifies each exported resource into one or more PROGRAMMES — real-world
# initiatives (CIS hardening, Defender, VPN, update rings, ...) that span several
# resource types and are otherwise invisible in the per-endpoint layout. It is
# read ONLY by 'docs generate-index', which writes the grouping into
# docs/index.yaml (each resource gains a 'groups' list; the header gains a
# 'programmes' registry with per-tenant counts). The download pipeline ignores
# it entirely, so it never affects a resource's YAML or any recorded fact.
#
# It records RULES, never facts, so editing it never requires re-downloading a
# tenant: change it and re-run 'docs generate-index' — the grouping updates in
# place. Resources matching no programme are reported as "uncategorised".
#
# The default is NO taxonomy: with this key absent, generate-index emits no
# programme grouping and falls back to per-type grouping. Leave it commented out
# — an active taxonomy changes docs/index.yaml, so spelling it out here would
# break the "loading this file == no config" guarantee.
#
# Structure:
#   taxonomy:
#     version: 1                 # schema version, must be >= 1
#     programmes:                # listed in DISPLAY ORDER
#       - id: <url-safe-token>   # stable id (lowercase, digits, hyphens); NEVER
#                                # reuse or rename it — it is a facet value in a URL
#         label: <display name>  # human-readable; safe to change any time
#         match:                 # a resource joins if ANY rule matches (OR);
#                                # within a rule every set field must match (AND);
#                                # each rule needs at least one field
#           - name: <regex>      # regex over displayName (case-insensitive)
#             type: <exact type> # exact resource type, e.g. Microsoft.Graph/mobileApps
#             odataType: <regex> # regex over @odata.type (case-insensitive)
#             platforms: <regex> # regex over the platforms fact (case-insensitive)
#             scope: device|user # exact device/user scope
#
# Worked example (regexes single-quoted so \b, \d stay literal for the regex
# engine rather than being interpreted by YAML):
#
# taxonomy:
#   version: 1
#   programmes:
#     - id: cis-hardening
#       label: CIS hardening
#       match:
#         - name: '_cis_'
#         - name: '[_-]l1$'
#     - id: compliance
#       label: Compliance
#       match:
#         - name: 'validation'
#         - type: Microsoft.Graph/deviceCompliancePolicies
#     - id: defender
#       label: Defender / MDE
#       match:
#         - name: '(?:mde|defender|\bngp\b|\basr\b)'
#     - id: vpn
#       label: VPN
#       match:
#         - name: 'vpn'
#     - id: windows-update
#       label: Windows Update
#       match:
#         - name: '(?:updatering|windows-update)'
#         - type: Microsoft.Graph/windowsFeatureUpdateProfiles
#     - id: identity-access
#       label: Identity & conditional access
#       match:
#         - type: Microsoft.Graph/conditionalAccessPolicies
#         - name: '(?:\bca\d{2}|\bmfa\b|2fa|passwordless|whfb)'
#     - id: app-delivery
#       label: App delivery
#       match:
#         - type: Microsoft.Graph/mobileApps

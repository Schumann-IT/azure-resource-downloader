# golangci-lint configuration — the single lint truth for this project.
#
# `make lint-check` (and `make lint`, which adds --fix) run golangci-lint with
# this file, and GoLand runs the same binary with the same file once Settings |
# Go | Linters | "Use config" points at it, so the editor cannot report a
# different set of findings than the one that gates a merge.
#
# Every linter beyond the default set is enabled to mirror a check that is
# already reported somewhere else, and says which one:
#   - a GoLand inspection that is on in the default profile, or
#   - a rule in the SonarQube quality profile this project is analysed with
#     (`make sonarqube-analyze` at the repository root).
# That keeps this file a parity statement rather than a taste statement: a
# stricter-than-both choice is a separate decision, not something to slip in
# here. Where a Sonar rule is parameterised, the parameter is copied from the
# quality profile and NOT taken from the linter's own default, so a finding
# reported here is the finding Sonar reports; changing a threshold is a change
# to make in both places at once, or the two stop agreeing.
#
# `golangci-lint config verify` validates this file against the v2 schema and
# runs as part of `make lint-check`, so a typo fails loudly instead of silently
# falling back to the defaults.
version: "2"

linters:
  # The set golangci-lint enables with no config at all: errcheck, govet,
  # ineffassign, staticcheck, unused. Naming it pins the baseline to the file
  # instead of to whichever version happens to be installed, and mirrors
  # GoLand's own bundled inspections for unhandled errors (errcheck), vet's
  # default passes (govet) and unused constants/variables/functions/types
  # (unused). staticcheck covers the deprecated-element, self-assignment,
  # unreachable-code and redundancy families; its ST style checks stay at
  # golangci-lint's own default subset.
  default: standard

  enable:
    # GoLand: "Redundant type conversion" (GoRedundantConversionInspection).
    - unconvert
    # GoLand: "Unused parameter" (GoUnusedParameterInspection). unparam is
    # stricter than the inspection — besides unused parameters it reports
    # parameters that always receive the same argument, which is the normal
    # shape of a test helper. Excluded for tests below rather than disabled, so
    # the dead-parameter half still applies to the code that ships.
    - unparam
    # Sonar go:S3776 "Cognitive Complexity of functions should not be too high".
    # gocognit implements the same Campbell metric the Sonar rule is based on;
    # measured against a full analysis, gocognit at Sonar's threshold reports
    # every function Sonar reports plus a few whose scores straddle it (the two
    # implementations differ by about one point, in both directions), so the
    # linter can never let a Sonar finding through.
    - gocognit
    # Deliberately NOT enabled: goconst, for Sonar go:S1192 "String literals
    # should not be duplicated". The two cannot be made to agree, and it is not
    # a matter of thresholds: S1192 counts occurrences per FILE and ignores
    # identifier-like literals, while goconst counts per PACKAGE and by default
    # skips call arguments — which is where all of this project's S1192 findings
    # live. Settings that equalise the counts still produce a different set
    # (2 of 5 shared when measured), i.e. exactly the two-tools-disagree state
    # this file exists to prevent. S1192 therefore stays a Sonar-only signal.

  settings:
    gocognit:
      # The quality profile's threshold, not gocognit's own default of 30:
      # report a function whose cognitive complexity exceeds 15. Go's explicit
      # error handling makes this metric climb fast, so expect the count to be
      # high until the worst functions are split up.
      min-complexity: 15

    govet:
      enable:
        # GoLand: "Nilness analyzer". Not in vet's default pass set, so it has
        # to be named here even though govet itself is already on.
        - nilness
      # Deliberately NOT enabled: `shadow`. GoLand has a "Shadowing variable"
      # inspection, but the analyzer is not part of vet's default suite, is off
      # by default in gopls, and upstream has proposed deprecating it as a
      # failed experiment. On this codebase it reports only idiomatic
      # `if err := f(); err != nil` blocks, where satisfying it would mean
      # renaming variables in correct error handling. It stays an editor hint,
      # not a merge gate.

  exclusions:
    rules:
      # unparam's "always receives" reports are noise in test helpers, which
      # exist precisely to be called with one fixed argument set today and
      # another tomorrow. GoLand's "Unused parameter" inspection does not
      # report that shape either, so excluding it here keeps the two in step.
      - path: _test\.go$
        linters:
          - unparam

      # gocognit on test files. A table-driven Go test is a table plus a
      # `for … t.Run(…)` loop plus the assertions each case needs, and that
      # shape scores high for reasons that are not maintainability risk: the
      # branching is the cases, not the logic. Sonar DOES report go:S3776 on
      # this project's `_test.go` files (13 of them at the time of writing), so
      # unlike the unparam exclusion above this one does not hold on its own —
      # it is mirrored by an `sonar.issue.ignore.multicriteria` entry in
      # sonar-project.properties. Change one and you must change the other.
      - path: _test\.go$
        linters:
          - gocognit

      # gocognit on the Microsoft Graph handlers. Each of these files is one
      # `New<Type>Handler` constructor returning a GraphCollectionHandler
      # literal whose `listIDs`, `fetchItem` and `transform` fields are
      # closures. gocognit attributes a nested closure's score to the enclosing
      # function, so the paging loop every handler needs (`for { Get; if resp ==
      # nil; for _, item := range …; if next == nil }`) is counted against the
      # constructor, and all 46 reported handlers land in a 27–34 band whatever
      # they actually do. The score therefore measures the shared pattern, not
      # the individual file, and satisfying it would mean 46 mechanical
      # extractions that leave each handler harder to read than it is now.
      #
      # Scoped to graph/ deliberately, NOT to internal/handlers/: the wider path
      # would also silence `requests.go` (`BuildFetchRequests`) and
      # `internal/handlers/arm/`, which are real branching logic — flat nil-guard
      # ladders in `Transform`, where a missed field is a real bug. Those three
      # are named one by one in the baseline below instead, so they stay visible
      # as debt and a *new* function in those files still reports.
      #
      # Mirrored in sonar-project.properties, same as the exclusion above.
      - path: internal/handlers/graph/
        linters:
          - gocognit

      # ----------------------------------------------------------------------
      # gocognit baseline: the 26 functions that already exceeded the threshold
      # when the rule was switched on, in 20 files.
      #
      # This is a DEBT LEDGER, not a set of exemptions. Nothing here is a finding
      # this project disagrees with — unlike the two exclusions above, which are
      # permanent decisions about a shape the metric misreads. Its only purpose is
      # to make `make lint-check`, `make check`, `make ci` and `make branch-ready`
      # usable while the rule guards everything written from now on, so that new
      # code has to comply and the backlog can be paid off a function at a time.
      # Clearing it is a parked idea in NEXT-ITERATIONS.md.
      #
      # Each entry names ONE function through `text`, not a file through `path`
      # alone. That is the whole point: excluding a path would blind the rule for
      # every function the file gains later, which is exactly the code the rule is
      # meant to catch. A second complex function in `writer.go` reports; the
      # three already listed do not.
      #
      # Two consequences to know. **A listed function can still get worse**
      # unnoticed, because the match is on its name and not on its score — the
      # same trade-off as a count-based baseline, and the reason splitting one up
      # is worth more than tidying it. **Nothing detects a stale entry**:
      # golangci-lint does not report an exclusion that matches nothing, so an
      # entry has to be deleted in the same commit as the refactor that fixes its
      # function. To re-measure from scratch, comment this block out and run
      # `make lint-check`.
      #
      # Deliberately NOT mirrored in sonar-project.properties, unlike the two
      # exclusions above. Those are suppressions — the finding should not be
      # reported anywhere, so the two tools must agree. This is deferred work, and
      # the server is where it stays counted: Sonar keeps reporting all 26 as
      # go:S3776, which is the ledger view this file cannot give (its ignores are
      # per file, so mirroring would also hide functions written tomorrow). The
      # asymmetry is the point, and it is one-way — the server reports a superset,
      # so it can never let something through that this file would have caught.
      - path: cmd/docs/generate_prompt\.go$
        text: 'func `reportGeneratePrompt` is high'
        linters:
          - gocognit
      - path: cmd/resource/drift\.go$
        text: 'func `runDrift` is high'
        linters:
          - gocognit
      - path: cmd/resource/list\.go$
        text: 'func `runList` is high'
        linters:
          - gocognit
      - path: cmd/resource/types\.go$
        text: 'func `runTypes` is high'
        linters:
          - gocognit
      - path: internal/azure/client\.go$
        text: 'func `(getDefaultSubscription|\(\*Client\)\.GetTenantDomain)` is high'
        linters:
          - gocognit
      - path: internal/docs/generateindex\.go$
        text: 'func `GenerateIndex` is high'
        linters:
          - gocognit
      - path: internal/docs/generateprompt\.go$
        text: 'func `GeneratePrompt` is high'
        linters:
          - gocognit
      - path: internal/docs/generateprompt_render\.go$
        text: 'func `renderSummaryFacts` is high'
        linters:
          - gocognit
      - path: internal/docs/metadata\.go$
        text: 'func `(mergeMetadata|pruneCovered)` is high'
        linters:
          - gocognit
      - path: internal/docs/taxonomy\.go$
        text: 'func `compileTaxonomy` is high'
        linters:
          - gocognit
      - path: internal/drift/drift\.go$
        text: 'func `Compare` is high'
        linters:
          - gocognit
      # The two ARM `Transform` methods: flat nil-guard ladders over the SDK's
      # pointer-heavy models. Named here rather than covered by a path exclusion
      # precisely because a missed field is a real bug in this shape.
      - path: internal/handlers/arm/storageaccount\.go$
        text: 'func `\(\*StorageAccountHandler\)\.Transform` is high'
        linters:
          - gocognit
      - path: internal/handlers/arm/virtualmachine\.go$
        text: 'func `\(\*VirtualMachineHandler\)\.Transform` is high'
        linters:
          - gocognit
      - path: internal/handlers/requests\.go$
        text: 'func `\(\*Registry\)\.BuildFetchRequests` is high'
        linters:
          - gocognit
      - path: internal/models/types\.go$
        text: 'func `ParseCleaningConfig` is high'
        linters:
          - gocognit
      - path: internal/pipeline/pipeline\.go$
        text: 'func `\(\*ExecutionSummary\)\.PrintSummary` is high'
        linters:
          - gocognit
      - path: internal/pipeline/transformer\.go$
        text: 'func `\(\*Transformer\)\.transformResource` is high'
        linters:
          - gocognit
      - path: internal/pipeline/writer\.go$
        text: 'func `(\(\*Writer\)\.Write|\(\*Writer\)\.writeResource|notificationTemplateRefsFromData)` is high'
        linters:
          - gocognit
      - path: internal/runprep/runprep\.go$
        text: 'func `BuildTransformerConfigs` is high'
        linters:
          - gocognit
      - path: internal/transform/base64\.go$
        text: 'func `decodeOmaSettings` is high'
        linters:
          - gocognit
      - path: internal/transform/cleaner\.go$
        text: 'func `(findAndRemoveKeysWithPreserve|removeEmptyValuesWithPath)` is high'
        linters:
          - gocognit

# golangci-lint truncates its own output by default: at most 50 findings per
# linter and 3 with the same message. Sonar truncates nothing, so with the
# defaults `make lint-check` would show a strict subset of what the server
# reports and the two could not be compared at all.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    # gofmt only. `make fmt` runs `go fmt`, i.e. gofmt, so GoLand's
    # format-on-save through `golangci-lint fmt` produces exactly the same
    # bytes, and `make fmt-check` keeps guarding it independently. goimports or
    # gofumpt would rewrite files that `make fmt` leaves alone.
    - gofmt

# SonarQube analysis of the docs browser. The scanner reads this file from its
# working directory, so it must be run from web/ — `make sonarqube-analyze-web`
# at the repository root does that for you (and produces the lcov report first).
#
# The server URL and the analysis token are NOT here: they are
# environment-specific and the token is a secret. Export SONAR_HOST_URL and
# SONAR_TOKEN instead.
sonar.projectKey=azure-rd-web
sonar.projectName=azure-rd Docs Browser
sonar.sourceEncoding=UTF-8

# Every path below is relative to this folder, which is the analysis root.
# `scripts/` holds the readiness gates and is real code, so it is analysed;
# `public/` is generated (app.css) and `dist/` is build output.
sonar.sources=src,views,scripts
sonar.tests=test
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=node_modules/**,dist/**,coverage/**,public/**

# Written by `npm test -- --coverage --coverageReporters=lcov`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Templates carry no logic, the readiness scripts are run by the gates rather
# than by Jest, and src/main.ts is the bootstrap that cannot be unit tested
# (which is why resolvePort lives in src/port.ts).
sonar.coverage.exclusions=views/**,scripts/**,src/main.ts

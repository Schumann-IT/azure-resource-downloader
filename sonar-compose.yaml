services:
  db:
    image: postgres:16-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    # sonar.env already sets POSTGRES_USER/PASSWORD/DB in the container, so
    # they are deliberately not repeated under `environment`: entries there
    # override env_file, and an uninterpolated ${POSTGRES_PASSWORD} (i.e. any
    # run without --env-file) would override them with empty strings and break
    # database initialisation.
    env_file: sonar.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # Bind mount into a folder next to this compose file
      - ./.sonar/postgres:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "9000:9000"
    # The app container has no use for POSTGRES_*, so it gets no env_file; it
    # needs the connection settings only. The defaults mirror sonar.env so the
    # stack also comes up with a plain `docker compose -f sonar-compose.yaml
    # up -d`, without --env-file.
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      # Bind mounts to local ./.sonar directory
      - ./.sonar/sonarqube/data:/opt/sonarqube/data
      - ./.sonar/sonarqube/extensions:/opt/sonarqube/extensions
      - ./.sonar/sonarqube/logs:/opt/sonarqube/logs
